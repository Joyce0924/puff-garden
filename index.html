<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3e9"><title>蓬蓬小岛 · Puff Garden</title></head><body><main><header><span class="brand">✳ PUFF GARDEN</span><span class="tag">找对对 · MVP</span></header><section class="intro"><p>找出唯一的一对，点一个就好</p><h1>蓬蓬小岛<span>✿</span></h1></section><div class="hud"><span id="hearts">♥♥♥</span><span>分数 <b id="score">0</b></span><strong id="timer">10.0s</strong></div><div class="time-track"><div id="timebar"></div></div><div class="play"><div class="status"><span>找到相同图案</span><span id="count">10 位小居民</span></div><canvas aria-label="可爱物品的物理碰撞场景"></canvas><div id="overlay"><h2 id="result"></h2><p id="result-detail"></p><button id="start">开始游戏</button></div><div class="hint" id="hint" role="status">从中心出发，轻轻挤一挤。</div></div><div class="actions"><span class="rule">点对 +100 · 点错 −1 ♥</span><button id="reset" aria-label="重置场景">↻ 重置</button></div><details><summary>调一调小岛 <span>参数设置 ↗</span></summary><div id="controls"></div><p class="note">仅开始前或结束后可调参数 · 半径变化会重置</p></details><footer>每轮增加 2 个 · 满容量后维持数量</footer></main><script type="module" src="/src.js"></script></body></html>
